var PAL=[

  ['#1a0a00','#c2410c'],['#1a0a1a','#be185d'],['#0a1a1a','#0891b2'],

];
var SHAPES=['◆','●','▲','■','★','✦','◉','⬡'];

function vCoverBg(id){
  var p=PAL[id%PAL.length];
  var a=(id*37)%360;
  return 'linear-gradient('+a+'deg,'+p[0]+' 0%,'+p[1]+' 100%)';
}

function vCoverHTML(id,title,small){
  var bg=vCoverBg(id);
  var shape=SHAPES[id%SHAPES.length];
  var short=title.length>20?title.substring(0,18)+'...':title;
  var sz=small?'0.7rem':'0.78rem';
  return '<div class="vinil-cover-gen" style="background:'+bg+';">'
    +'<div class="vinil-cover-shape">'+shape+'</div>'
    +'<div class="vinil-cover-text" style="font-size:'+sz+'">'+short+'</div>'
    +'</div>';
}

      +'<div class="vinil-top-mini-cover">'+vCoverHTML(a.id,a.t,true)+'</div>'
      +'<div class="vinil-top-info"><div class="vinil-top-title">'+a.t+'</div><div class="vinil-top-artist">'+a.a+' · '+(cat?cat.icon+' '+cat.nome:'')+'</div></div>'
      +'<a class="vinil-top-dl" href="'+a.link+'" target="_blank" rel="noopener noreferrer" onclick="vShowToast(\'⬇ Baixando...\',\'green\')">⬇ Baixar</a>';
    topList.appendChild(div);
  });

  // Cat grid
  var catGrid=document.getElementById('vcat-home-grid');
  CATS.forEach(function(cat){
    var cnt=ALBUNS.filter(function(a){return a.cat===cat.id;}).length;
    var div=document.createElement('div');
    div.className='vinil-cat-card-home';
    div.innerHTML='<div class="vinil-cat-emoji">'+cat.icon+'</div><div class="vinil-cat-name">'+cat.nome+'</div><div class="vinil-cat-cnt">'+cnt+' albuns</div>';
    div.onclick=function(){vSelectCat(cat.id);};
    catGrid.appendChild(div);
  });
}

// ============ SELECT CAT ============
function vSelectCat(catId){
  vCurrentCat=catId;
  document.getElementById('vinil-search').value='';
  document.querySelectorAll('.vinil-cat-pill').forEach(function(p){p.classList.remove('active');});
  var pill=document.getElementById('vpill-'+catId);
  if(pill) pill.classList.add('active');

  var cat=CATS.find(function(c){return c.id===catId;});
  var lista=ALBUNS.filter(function(a){return a.cat===catId;});

  document.getElementById('vinil-breadcrumb').innerHTML=
    '<span class="vbc-home" onclick="vShowHome()">Inicio</span>'
    +' <span style="color:rgba(255,255,255,0.15)">›</span> '
    +'<span class="vbc-current">'+(cat?cat.icon+' '+cat.nome:catId)+'</span>';

  var html='<div style="margin-bottom:1.5rem;">'
    +'<div style="font-size:2.5rem;margin-bottom:0.4rem;">'+(cat?cat.icon:'📁')+'</div>'
    +'<h2 style="font-family:Georgia,serif;font-size:2rem;font-weight:700;margin-bottom:0.2rem;">'+(cat?cat.nome:catId)+'</h2>'
    +'<p style="color:#6b6b8a;font-size:0.85rem;">'+lista.length+' albuns disponíveis</p>'
    +'</div>'
    +'<div class="vinil-grid" id="vinil-main-grid"></div>';

  document.getElementById('vinil-content').innerHTML=html;
  var grid=document.getElementById('vinil-main-grid');
  lista.forEach(function(a){grid.appendChild(vCreateCard(a));});
}

// ============ SEARCH ============
document.getElementById('vinil-search').addEventListener('input',function(){
  var term=this.value.trim().toLowerCase();
  if(term.length<2){
    if(vCurrentCat) vSelectCat(vCurrentCat);
    else vShowHome();
    return;
  }
  var res=ALBUNS.filter(function(a){
    return a.t.toLowerCase().indexOf(term)>-1||a.a.toLowerCase().indexOf(term)>-1;
  });
  document.getElementById('vinil-breadcrumb').innerHTML=
    '<span class="vbc-home" onclick="vShowHome()">Inicio</span>'
    +' <span style="color:rgba(255,255,255,0.15)">›</span> '
    +'<span class="vbc-current">🔍 "'+this.value+'"</span>';

  var html='<div style="margin-bottom:1.5rem;">'
    +'<h2 style="font-family:Georgia,serif;font-size:2rem;font-weight:700;margin-bottom:0.2rem;">🔍 Resultados</h2>'
    +'<p style="color:#6b6b8a;font-size:0.85rem;">'+res.length+' albuns encontrados</p>'
    +'</div>'
    +'<div class="vinil-grid" id="vinil-main-grid"></div>';

  document.getElementById('vinil-content').innerHTML=html;
  var grid=document.getElementById('vinil-main-grid');
  if(res.length===0){
    grid.innerHTML='<div class="vinil-empty"><div class="vinil-empty-icon">🎵</div><p>Nenhum resultado.</p></div>';
  } else {
    res.forEach(function(a){grid.appendChild(vCreateCard(a));});
  }
});

// ============ CREATE CARD ============
function vCreateCard(album){
  var div=document.createElement('div');
  div.className='vinil-card';
  div.innerHTML='<div class="vinil-card-cover">'
    +vCoverHTML(album.id,album.t,false)
    +'<div class="vinil-card-overlay">'
    +'<a class="vinil-dl-btn-small" href="'+album.link+'" target="_blank" rel="noopener noreferrer" onclick="vShowToast(\'⬇ Baixando...\',\'green\')">⬇ BAIXAR</a>'
    +'</div>'
    +'</div>'
    +'<div class="vinil-card-info">'
    +'<div class="vinil-card-title" title="'+album.t+'" onclick="vOpenModal('+album.id+')" style="cursor:pointer;">'+album.t+'</div>'
    +'<div class="vinil-card-artist">'+album.a+'</div>'
    +'<div class="vinil-card-foot"><span class="vinil-badge-mp3">MP3</span><a class="vinil-card-dl-direct" href="'+album.link+'" target="_blank" rel="noopener noreferrer" onclick="vShowToast(\'⬇ Baixando...\',\'green\')">⬇ Baixar</a></div>'
    +'</div>';
  return div;
}

// ============ MODAL ============
function vOpenModal(id){
  var album=ALBUNS.find(function(a){return a.id===id;});
  if(!album) return;
  var cat=CATS.find(function(c){return c.id===album.cat;});
  document.getElementById('vinil-modal-cat').textContent=cat?cat.icon+' '+cat.nome:'';
  document.getElementById('vinil-modal-title').textContent=album.t;
  document.getElementById('vinil-modal-artist').textContent=album.a;

  var bg=vCoverBg(album.id);
  var shape=SHAPES[album.id%SHAPES.length];
  document.getElementById('vinil-modal-art').innerHTML=
    '<button class="vinil-modal-close" onclick="vCloseModal()">✕</button>'
    +'<div style="width:100%;height:100%;background:'+bg+';display:flex;align-items:center;justify-content:center;font-size:5rem;opacity:0.15;">'+shape+'</div>'
    +'<div style="position:absolute;inset:0;background:linear-gradient(to top,#0f0f1a,transparent 55%);"></div>'
    +'<div style="position:absolute;bottom:0;left:0;right:0;padding:1rem;">'
    +'<div style="font-family:Georgia,serif;font-size:1.1rem;font-weight:700;color:white;text-shadow:0 2px 8px rgba(0,0,0,0.8);">'+album.t.substring(0,40)+'</div>'
    +'</div>';

  // Update the download anchor href directly - no window.open needed
  var dlBtn=document.getElementById('vinil-btn-dl');
  dlBtn.href=album.link;
  dlBtn.onclick=function(){
    vShowToast('⬇ Download iniciado!','green');
    setTimeout(function(){vCloseModal();},400);
    return true; // allow the href to work
  };
  document.getElementById('vinil-btn-copy').onclick=function(){
    if(navigator.clipboard){
      navigator.clipboard.writeText(album.link).then(function(){vShowToast('🔗 Link copiado!','yellow');});
    } else {
      var el=document.createElement('textarea');
      el.value=album.link;
      document.body.appendChild(el);
      el.select();
      document.execCommand('copy');
      document.body.removeChild(el);
      vShowToast('🔗 Link copiado!','yellow');
    }
  };
  document.getElementById('vinil-modal-overlay').classList.add('open');
}

function vCloseModal(){document.getElementById('vinil-modal-overlay').classList.remove('open');}
function vHandleModalClick(e){if(e.target===document.getElementById('vinil-modal-overlay')) vCloseModal();}
document.addEventListener('keydown',function(e){if(e.key==='Escape') vCloseModal();});

// ============ TOAST ============
function vShowToast(msg,type){
  var stack=document.getElementById('vinil-toasts');
  var t=document.createElement('div');
  t.className='vinil-toast'+(type==='pink'?' pink':type==='green'?' green':'');
  t.textContent=msg;
  stack.appendChild(t);
  setTimeout(function(){t.remove();},3500);
}
